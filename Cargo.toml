[workspace]
members = [
    "crates/zkfly-matrix",
    "crates/zkfly-bench",
    "crates/zkfly-commitment",
    "crates/zkfly-nova",
]
exclude = ["vendor/nova-snark"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0-only"

[workspace.dependencies]
arrow-array = "59.1.0"
arrow-ipc = { version = "59.1.0", features = ["lz4", "zstd"] }
arrow-schema = "59.1.0"
ark-bn254 = "0.5.0"
ark-ff = "0.5.0"
nova-snark = { path = "vendor/nova-snark", default-features = false }
clap = { version = "4.6.6", features = ["derive"] }
cuda-nova = { git = "https://github.com/RyanKung/cuda-nova.git", rev = "8b694223cb91c7f4ef87602df097c6d4b708b1fe" }
ff = "0.13.0"
halo2curves = "0.9.0"
hex = "0.4.3"
light-poseidon = "0.4.0"
rustc-hash = "2.1.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
tempfile = "3.23.0"
thiserror = "2.0.17"
topology-commitment = { package = "zkfly-commitment", path = "crates/zkfly-commitment" }
topology-nova = { package = "zkfly-nova", path = "crates/zkfly-nova" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
