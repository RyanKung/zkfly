[package]
edition = "2021"
rust-version = "1.67.1"
name = "arecibo"
version = "0.1.1"
authors = [
    "Srinath Setty <srinath@microsoft.com>",
    "Lurk Engineering <engineering@lurk-lab.com>",
]
description = "Recursive zkSNARKs without trusted setup"
documentation = "https://docs.rs/arecibo/"
readme = "README.md"
keywords = [
    "zkSNARKs",
    "cryptography",
    "proofs",
]
license-file = "LICENSE"
repository = "https://github.com/lurk-lab/arecibo"

[profile.dev-ci]
opt-level = 3
lto = "thin"
codegen-units = 16
incremental = false
inherits = "dev"

[[bench]]
name = "recursive-snark"
harness = false

[[bench]]
name = "compressed-snark"
harness = false

[[bench]]
name = "compute-digest"
harness = false

[[bench]]
name = "sha256"
harness = false

[[bench]]
name = "recursive-snark-supernova"
harness = false

[[bench]]
name = "compressed-snark-supernova"
harness = false

